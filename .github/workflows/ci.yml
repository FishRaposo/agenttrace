name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared-core + SDK + server
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/FishRaposo/operator-shared-core.git" ruff
          pip install -e ./sdk
          pip install -e "./server[dev]"
      - run: ruff check server/app sdk/agenttrace examples server/tests sdk/tests
      - run: ruff format --check server/app sdk/agenttrace examples server/tests sdk/tests

  sdk-test:
    name: SDK Tests (standalone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=agenttrace --cov-report=term --cov-fail-under=85
      - name: Build SDK package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared-core + server
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/FishRaposo/operator-shared-core.git"
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=85

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker-build:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t agenttrace-server ./server
      - name: Build dashboard image
        run: docker build -t agenttrace-dashboard ./dashboard
