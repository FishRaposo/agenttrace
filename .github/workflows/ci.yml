name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install SDK + self-contained server (from lockfiles)
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-lock.txt
          pip install --no-deps -e ./sdk -e ./server
      - run: ruff check server/app sdk/agenttrace examples server/tests sdk/tests scripts
      - run: ruff format --check server/app sdk/agenttrace examples server/tests sdk/tests scripts

  lockfiles:
    name: Python Lockfiles In Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.8.17
      # `make lock` keeps existing pins as preferences, so it only rewrites a
      # file when the three locks disagree (e.g. Dependabot bumped one file).
      - run: make lock
      - run: git diff --exit-code -- sdk/requirements-lock.txt server/requirements-lock.txt server/requirements.txt

  sdk-test:
    name: SDK Tests (standalone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install SDK (from lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Run tests with coverage report
        run: python -m pytest tests/ -q --cov=agenttrace --cov-report=term
      - name: Build SDK package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install self-contained server (from lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          # tests/test_evidence.py imports scripts/portfolio_demo.py, which uses the SDK.
          pip install --no-deps -e . -e ../sdk
      - name: Run tests with coverage report
        run: python -m pytest tests/ -q --cov=app --cov-report=term
      - name: Verify optional ASGI lifecycle with real dependencies
        run: python -m pytest ../sdk/tests/test_asgi_lifecycle.py -q

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium

  evidence:
    name: Offline Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project extras (from lockfiles)
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-lock.txt
          pip install --no-deps -e ./sdk -e ./server
      - run: python scripts/portfolio_demo.py
      - run: python scripts/verify_portfolio_evidence.py
      - run: python scripts/verify_connected_evidence.py --connected docs/evidence/connected/report.json --benchmark docs/evidence/tracing-benchmark.json

  forbidden-dependencies:
    name: Forbidden Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan source and operations files
        run: python scripts/check_forbidden_dependencies.py

  package-install:
    name: Wheel Install Without External Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build sdk
          python -m build server
          python scripts/check_wheel_contents.py
      - name: Install wheels in an isolated environment
        run: |
          python -m venv /tmp/agenttrace-wheel-venv
          /tmp/agenttrace-wheel-venv/bin/pip install -c server/requirements.txt sdk/dist/*.whl server/dist/*.whl
          /tmp/agenttrace-wheel-venv/bin/python -c "import agenttrace; import agenttrace.issue_pr; import agenttrace.issue_pr.audit; import agenttrace.issue_pr.commands; import agenttrace.issue_pr.git; import agenttrace.issue_pr.mock; import agenttrace.issue_pr.models; import agenttrace.issue_pr.protocols; import agenttrace.issue_pr.safety; import agenttrace.issue_pr.workflow; import app.main; import app.config; import app.db; import app.internal.vendor_core.pricing"

  docker-build:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build -t agenttrace-server ./server
      - name: Build dashboard image
        run: docker build -t agenttrace-dashboard ./dashboard

  connected-live:
    name: Connected dashboard against real collector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install SDK + self-contained server
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk[dev]" -e "./server[dev]"
      - name: Start disposable loopback collector
        working-directory: .
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/agenttrace-live/agenttrace.db
          AUTH_REQUIRED: "false"
          PORTFOLIO_LAUNCH_ENABLED: "true"
          PORTFOLIO_COLLECTOR_URL: http://127.0.0.1:8300
          CORS_ORIGINS: '["http://localhost:3404","http://127.0.0.1:3404"]'
          RATE_LIMIT_REQUESTS: "100000"
          TRACE_SAMPLING_MODE: "off"
        run: |
          mkdir -p "$RUNNER_TEMP/agenttrace-live"
          nohup python -m uvicorn app.main:app --app-dir server \
            --host 127.0.0.1 --port 8300 \
            > "$RUNNER_TEMP/collector.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8300/health > /dev/null; then
              echo "collector ready after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "collector failed to start"; cat "$RUNNER_TEMP/collector.log"; exit 1
      - run: npm ci
      - name: Build dashboard against live collector
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8300
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify connected HTTP contracts
        working-directory: .
        run: |
          python scripts/verify_connected_portfolio.py --endpoint http://127.0.0.1:8300
          python scripts/verify_connected_integrity.py --endpoint http://127.0.0.1:8300
      - name: Live browser suite
        env:
          AGENTTRACE_API_URL: http://127.0.0.1:8300
          AGENTTRACE_SCREENSHOTS: ${{ runner.temp }}/agenttrace-live/shots
        run: npm run test:e2e:live
      - name: Collector log on failure
        if: failure()
        working-directory: .
        run: cat "$RUNNER_TEMP/collector.log" || true
