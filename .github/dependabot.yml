version: 2

# Dependency policy (portfolio X7):
# - minor and patch updates arrive as one grouped PR per ecosystem and directory;
# - majors of the framework/toolchain packages below are ignored and migrated by
#   hand (the 2026-09-25 grouped merge of Tailwind 4 + TypeScript 7 broke the
#   dashboard build and lint);
# - any other major arrives as its own PR so CI gates it individually.
# Python installs in CI and the server image come from sdk/requirements-lock.txt,
# server/requirements-lock.txt and server/requirements.txt (runtime), all
# generated by `make lock`. Dependabot bumps each file without re-resolving, so
# the "Python Lockfiles In Sync" CI job reruns `make lock` and fails on any diff;
# fix a failing bump by running `make lock` on its branch.

updates:
  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]
      - dependency-name: fastapi
        update-types: ["version-update:semver-major"]
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]
      - dependency-name: pydantic-settings
        update-types: ["version-update:semver-major"]
      - dependency-name: fastapi
        update-types: ["version-update:semver-major"]
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript-eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: ioredis
        update-types: ["version-update:semver-major"]
      # vitest 5 forks pool crashes on the CI Node 20 runtime; pinned ^4.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # jsdom 30 crashes vitest fork workers on CI Node 20 ('bind' error); pinned ^24.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
