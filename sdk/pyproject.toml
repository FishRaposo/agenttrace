[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "A lightweight observability and replay layer for agentic AI workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov", "mypy", "ruff", "pyright>=1.1.411"]

[tool.setuptools.packages.find]
include = ["agenttrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# Ruff is configured at the repository root (agenttrace/ruff.toml).
