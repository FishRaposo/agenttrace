version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agenttrace_server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://agenttrace:agenttrace@db:5432/agenttrace
      - DATABASE_TYPE=postgres
      - REDIS_URL=redis://redis:6379/0
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://dashboard:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agenttrace_dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      server:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: agenttrace_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=agenttrace
      - POSTGRES_PASSWORD=agenttrace
      - POSTGRES_DB=agenttrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agenttrace_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
